name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore
        run: |
          dotnet restore Bing.Offices.sln
          dotnet restore tests/Bing.Offices.ResourceProbe/Bing.Offices.ResourceProbe.csproj

      - name: Build
        run: |
          dotnet build Bing.Offices.sln -c Release --no-restore
          dotnet build tests/Bing.Offices.ResourceProbe/Bing.Offices.ResourceProbe.csproj -c Release --no-restore

      - name: Check diff
        run: git diff --check

      - name: Test
        run: |
          dotnet test tests/Bing.Offices.Tests/Bing.Offices.Tests.csproj -f net6.0 -c Release --no-restore --results-directory artifacts/tests/unit/net6 --logger "trx;LogFileName=unit-net6.trx"
          dotnet test tests/Bing.Offices.Tests/Bing.Offices.Tests.csproj -f net8.0 -c Release --no-restore --results-directory artifacts/tests/unit/net8 --logger "trx;LogFileName=unit-net8.trx"
          dotnet test tests/Bing.Offices.Tests.Integration/Bing.Offices.Tests.Integration.csproj -f net6.0 -c Release --no-restore --results-directory artifacts/tests/integration/net6 --logger "trx;LogFileName=integration-net6.trx"
          dotnet test tests/Bing.Offices.Tests.Integration/Bing.Offices.Tests.Integration.csproj -f net8.0 -c Release --no-restore --results-directory artifacts/tests/integration/net8 --logger "trx;LogFileName=integration-net8.trx"
          dotnet test tests/Bing.Offices.Docs.Tests/Bing.Offices.Docs.Tests.csproj -c Release --no-restore --results-directory artifacts/tests/docs --logger "trx;LogFileName=docs-net8.trx"

      - name: Resource and benchmark contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-contracts
          dotnet run --project tests/Bing.Offices.ResourceProbe/Bing.Offices.ResourceProbe.csproj \
            -c Release --no-build --no-restore -- \
            --staging-matrix artifacts/ci-contracts/resource-matrix.jsonl 1000 \
            | tee artifacts/ci-contracts/resource-matrix.log
          grep -q 'scenarios=36 status=passed' artifacts/ci-contracts/resource-matrix.log
          dotnet run --project benchmarks/Bing.Offices.Benchmarks/Bing.Offices.Benchmarks.csproj \
            -c Release --no-build --no-restore -- --list flat \
            | tee artifacts/ci-contracts/benchmark-list.log
          grep -q 'RealIoBenchmarks' artifacts/ci-contracts/benchmark-list.log
          grep -q 'MiniExcelRealIoBenchmarks' artifacts/ci-contracts/benchmark-list.log

      - name: Pack
        run: |
          rm -rf artifacts/packages
          mkdir -p artifacts/packages
          dotnet pack src/Bing.Offices.Abstractions/Bing.Offices.Abstractions.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack src/Bing.Offices.Core/Bing.Offices.Core.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack src/Bing.Offices.Npoi/Bing.Offices.Npoi.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack src/Bing.Offices.MiniExcel/Bing.Offices.MiniExcel.csproj -c Release --no-restore -o artifacts/packages

      - name: Verify packages
        shell: bash
        run: |
          test "$(find artifacts/packages -name '*.nupkg' | wc -l)" -eq 4
          test "$(find artifacts/packages -name '*.snupkg' | wc -l)" -eq 4
          for package in artifacts/packages/*.nupkg; do
            unzip -l "$package" | grep -q 'lib/'
            unzip -l "$package" | grep -q '\.xml$'
          done
          mapfile -t mini_packages < <(find artifacts/packages -maxdepth 1 -type f \
            -name 'Bing.Offices.MiniExcel.*.nupkg' ! -name '*.snupkg' | sort)
          test "${#mini_packages[@]}" -eq 1
          package_version="$(unzip -p "${mini_packages[0]}" '*.nuspec' \
            | sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' | head -n 1)"
          test -n "$package_version"
          for package_id in Bing.Offices.Abstractions Bing.Offices.Core Bing.Offices.Npoi Bing.Offices.MiniExcel; do
            test -f "artifacts/packages/${package_id}.${package_version}.nupkg"
          done
          if unzip -p "${mini_packages[0]}" '*.nuspec' | grep -qi 'NPOI'; then
            echo 'Bing.Offices.MiniExcel must not depend on NPOI.' >&2
            exit 1
          fi
          echo "BING_OFFICES_PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Package consumers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/consumers/results artifacts/consumers/cache/net6 artifacts/consumers/cache/net8
          dotnet restore tests/Bing.Offices.Consumer.Net6/Bing.Offices.Consumer.Net6.csproj \
            --configfile tests/Bing.Offices.Consumer.Net6/NuGet.Config \
            --packages artifacts/consumers/cache/net6 \
            -p:BingOfficesPackageVersion="$BING_OFFICES_PACKAGE_VERSION"
          dotnet restore tests/Bing.Offices.Consumer.Net8/Bing.Offices.Consumer.Net8.csproj \
            --configfile tests/Bing.Offices.Consumer.Net8/NuGet.Config \
            --packages artifacts/consumers/cache/net8 \
            -p:BingOfficesPackageVersion="$BING_OFFICES_PACKAGE_VERSION"
          dotnet build tests/Bing.Offices.Consumer.Net6/Bing.Offices.Consumer.Net6.csproj \
            -c Release --no-restore -p:BingOfficesPackageVersion="$BING_OFFICES_PACKAGE_VERSION" \
            | tee artifacts/consumers/results/net6-build.log
          dotnet build tests/Bing.Offices.Consumer.Net8/Bing.Offices.Consumer.Net8.csproj \
            -c Release --no-restore -p:BingOfficesPackageVersion="$BING_OFFICES_PACKAGE_VERSION" \
            | tee artifacts/consumers/results/net8-build.log
          dotnet run --project tests/Bing.Offices.Consumer.Net6/Bing.Offices.Consumer.Net6.csproj \
            -c Release --no-build --no-restore -p:BingOfficesPackageVersion="$BING_OFFICES_PACKAGE_VERSION" \
            | tee artifacts/consumers/results/net6-run.log
          dotnet run --project tests/Bing.Offices.Consumer.Net8/Bing.Offices.Consumer.Net8.csproj \
            -c Release --no-build --no-restore -p:BingOfficesPackageVersion="$BING_OFFICES_PACKAGE_VERSION" \
            | tee artifacts/consumers/results/net8-run.log
          grep -q "Bing.Offices.Npoi+Bing.Offices.MiniExcel/$BING_OFFICES_PACKAGE_VERSION" artifacts/consumers/results/net6-run.log
          grep -q "Bing.Offices.Npoi+Bing.Offices.MiniExcel/$BING_OFFICES_PACKAGE_VERSION" artifacts/consumers/results/net8-run.log

      - name: Governance checks
        shell: bash
        run: |
          mkdir -p artifacts/api
          dotnet run --project build/ApiSnapshot/ApiSnapshot.csproj \
            -c Release --no-build --no-restore -- --identity-self-test true \
            | tee artifacts/api/identity-self-test.log
          dotnet run --project build/ApiSnapshot/ApiSnapshot.csproj \
            -c Release --no-build --no-restore -- \
            --root output/release \
            --baseline build/api-snapshot-baseline.json \
            --packages artifacts/packages \
            --repository . \
            --output artifacts/api/compare \
            | tee artifacts/api/compare.log
          test "$(sha256sum version.props | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')" = "77FEBEC429F841DC839F84FED57A48AE4159DF2EA92A15AD808BB3027C39B0D1"
          test "$(sha256sum version.dev.props | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')" = "BABFE7703A15E1C11F46B45D34BC59D7913ECB1E3DCFDA901E72F4D60A8D134D"
          test -z "$(find src tests benchmarks -type d \
            \( -name artifacts -o -name TestResults -o -name BenchmarkDotNet.Artifacts \) -print -quit)"

      - name: Upload package evidence
        uses: actions/upload-artifact@v4
        with:
          name: bing-offices-package-evidence
          path: |
            artifacts/packages
            artifacts/consumers/results
            artifacts/ci-contracts
            artifacts/api
            artifacts/tests
