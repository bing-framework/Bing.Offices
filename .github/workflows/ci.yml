name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore
        run: |
          dotnet restore Bing.Offices.sln
          dotnet restore tests/Bing.Offices.ResourceProbe/Bing.Offices.ResourceProbe.csproj

      - name: Build
        run: |
          dotnet build Bing.Offices.sln -c Release --no-restore
          dotnet build tests/Bing.Offices.ResourceProbe/Bing.Offices.ResourceProbe.csproj -c Release --no-restore

      - name: Check diff
        run: git diff --check

      - name: Test
        run: |
          dotnet test tests/Bing.Offices.Tests/Bing.Offices.Tests.csproj -f net6.0 -c Release --no-build --no-restore
          dotnet test tests/Bing.Offices.Tests/Bing.Offices.Tests.csproj \
            -f net8.0 -c Release --no-build --no-restore \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=ci-tests-net8.trx" \
            --results-directory TestResults
          dotnet test tests/Bing.Offices.Tests.Integration/Bing.Offices.Tests.Integration.csproj -f net6.0 -c Release --no-build --no-restore
          dotnet test tests/Bing.Offices.Tests.Integration/Bing.Offices.Tests.Integration.csproj -f net8.0 -c Release --no-build --no-restore
          dotnet test tests/Bing.Offices.Docs.Tests/Bing.Offices.Docs.Tests.csproj -c Release --no-build --no-restore

      - name: Verify coverage report
        shell: bash
        run: |
          set -euo pipefail
          coverage_root="TestResults"
          if [[ ! -d "$coverage_root" ]]; then
            echo "Coverage results directory is missing: $coverage_root" >&2
            exit 1
          fi
          mapfile -t coverage_reports < <(find "$coverage_root" -type f -name coverage.cobertura.xml -print | LC_ALL=C sort)
          if [[ ${#coverage_reports[@]} -lt 1 ]]; then
            echo "Expected at least one Cobertura report; found none." >&2
            exit 1
          fi
          coverage_report="${coverage_reports[0]}"
          if [[ ! -s "$coverage_report" ]]; then
            echo "Coverage report is empty: $coverage_report" >&2
            exit 1
          fi
          if ! python3 -c 'import sys; import xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' "$coverage_report"; then
            echo "Coverage report is not valid XML: $coverage_report" >&2
            exit 1
          fi
          for duplicate in "${coverage_reports[@]:1}"; do
            if ! cmp -s "$coverage_report" "$duplicate"; then
              echo "Cobertura reports differ: $coverage_report and $duplicate" >&2
              exit 1
            fi
          done

      - name: Resource and benchmark contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-contracts
          dotnet run --project tests/Bing.Offices.ResourceProbe/Bing.Offices.ResourceProbe.csproj \
            -c Release --no-build --no-restore -- \
            --staging-matrix artifacts/ci-contracts/resource-matrix.jsonl 1000 \
            | tee artifacts/ci-contracts/resource-matrix.log
          grep -q 'scenarios=36 status=passed' artifacts/ci-contracts/resource-matrix.log
          dotnet run --project benchmarks/Bing.Offices.Benchmarks/Bing.Offices.Benchmarks.csproj \
            -c Release --no-build --no-restore -- --list flat \
            | tee artifacts/ci-contracts/benchmark-list.log
          grep -q 'RealIoBenchmarks' artifacts/ci-contracts/benchmark-list.log

      - name: Verify package candidate
        shell: pwsh
        run: ./build/Verify-PackageCandidate.ps1 -OutputDirectory artifacts/package-candidate

      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bing-offices-package-evidence
          path: |
            artifacts/package-candidate
            artifacts/ci-contracts
            TestResults
